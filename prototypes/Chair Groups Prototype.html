<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group DNA — My groups (prototype)</title>
<style>
  :root {
    --navy: #1F3864;
    --navy-dark: #14274a;
    --bg: #F4F5F7;
    --card: #FFFFFF;
    --border: #DDE1E8;
    --text: #1C1F26;
    --muted: #6B7280;
    --na: #B5651D;
    --na-bg: #FEF3E7;
    --ai-bg: #EAF1FB;
    --ai-border: #C4D7F0;
    --action-bg: #FDECC8;
    --action-border: #F0CE84;
    --action-text: #7A5B00;
    --wait-bg: #EEF0F3;
    --wait-text: #6B7280;
    --approved-bg: #E7F6EC;
    --approved-border: #BFE6CC;
    --approved-text: #2F7D4F;
    --reedit-bg: #EAF1FB;
    --reedit-border: #C4D7F0;
    --reedit-text: #1B3A6B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .prototype-flag {
    background: #FFF7E0;
    border-bottom: 1px solid #EAD98B;
    color: #6B5900;
    font-size: 12px;
    text-align: center;
    padding: 6px 12px;
  }
  header.topbar {
    background: var(--navy);
    color: #fff;
  }
  header.topbar .topbar-inner {
    max-width: 1040px;
    margin: 0 auto;
    padding: 16px 20px;
  }
  header.topbar .brand { font-weight: 700; font-size: 18px; text-align: left; }
  nav.subnav {
    background: var(--navy);
    border-top: 1px solid rgba(255,255,255,0.18);
    color: #fff;
  }
  nav.subnav .subnav-inner {
    max-width: 1040px;
    margin: 0 auto;
    padding: 10px 20px;
    text-align: left;
    font-size: 13px;
    opacity: 0.9;
  }
  nav.subnav a { color: #fff; text-decoration: underline; cursor: pointer; }
  nav.subnav a:hover { opacity: 0.85; }
  .status-pill {
    background: rgba(31,56,100,0.08);
    border: 1px solid var(--border);
    color: var(--navy);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 12px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .who-pill {
    background: rgba(31,56,100,0.08);
    border: 1px solid var(--border);
    color: var(--navy);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 12px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 20px 80px; }

  /* ---------- list view ---------- */
  .page-head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .page-head h1 { margin: 0 0 2px; font-size: 22px; color: var(--navy); }
  .page-head .sub { font-size: 13px; color: var(--muted); }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 14px 0 16px;
  }
  .search-input {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13px;
    font-family: inherit;
    min-width: 320px;
  }
  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .summary-chip {
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12.5px;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .summary-chip.active { border-color: var(--navy); color: var(--navy); font-weight: 600; background: #EAF1FB; }
  .summary-chip .count { background: var(--navy); color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 7px; }

  table.groups-table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    font-size: 13px;
  }
  table.groups-table th, table.groups-table td {
    text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid #EEF0F3;
  }
  table.groups-table thead th {
    background: #FAFBFC;
    color: var(--navy);
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    cursor: pointer;
    user-select: none;
    white-space: normal;
    line-height: 1.35;
    vertical-align: bottom;
  }
  table.groups-table thead th:hover { background: #F0F2F5; }
  table.groups-table thead th .arrow { opacity: 0.6; font-size: 10px; margin-left: 3px; }
  table.groups-table tbody tr { cursor: pointer; }
  table.groups-table tbody tr:hover { background: #F7F9FC; }
  table.groups-table tbody tr:last-child td { border-bottom: none; }
  table.groups-table td.name-cell { color: var(--navy); font-weight: 600; }
  table.groups-table td.muted-cell { color: var(--muted); }
  .row-action-marker {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    margin-right: 8px;
    background: var(--action-border);
    vertical-align: middle;
  }
  tr.is-action .row-action-marker { background: #E0A800; }
  tr:not(.is-action) .row-action-marker { background: transparent; }

  .pill { border-radius: 999px; padding: 3px 10px; font-size: 11.5px; font-weight: 600; white-space: normal; line-height: 1.3; display: inline-block; }
  .pill.action { background: var(--action-bg); border: 1px solid var(--action-border); color: var(--action-text); }
  .pill.wait { background: var(--wait-bg); border: 1px solid var(--border); color: var(--wait-text); }
  .pill.approved { background: var(--approved-bg); border: 1px solid var(--approved-border); color: var(--approved-text); }
  .pill.reedit { background: var(--reedit-bg); border: 1px solid var(--reedit-border); color: var(--reedit-text); }

  .export-tag { font-size: 12px; white-space: nowrap; }
  .export-tag.exported { color: var(--approved-text); font-weight: 600; }
  .export-tag.pending { color: #8A6D00; }
  .export-tag.na { color: var(--muted); }

  .empty-state { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 0; }

  /* ---------- waiting view ---------- */
  .info-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px 24px;
  }
  .info-card p { font-size: 14px; line-height: 1.6; margin: 0 0 16px; }

  /* ---------- review view (from Chair Review Prototype) ---------- */
  .group-header {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 18px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .group-header h1 { margin: 0 0 4px; font-size: 20px; color: var(--navy); }
  .group-header .meta { font-size: 13px; color: var(--muted); }
  button { font-family: inherit; cursor: pointer; }
  .btn { border-radius: 6px; padding: 9px 16px; font-size: 13px; border: 1px solid var(--border); background: #fff; color: var(--text); }
  .btn:hover { background: #F0F2F5; }
  .btn-primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  .btn-primary:hover { background: var(--navy-dark); }
  .btn-small { font-size: 12px; padding: 5px 10px; border-radius: 5px; flex-shrink: 0; }
  .section-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 18px; overflow: hidden; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); background: #FAFBFC; }
  .card-head h2 { font-size: 14px; color: var(--navy); margin: 0; }
  .field-body { padding: 16px 20px; }
  .field-text { font-size: 13.5px; line-height: 1.6; white-space: pre-line; }
  .field-text strong { color: var(--navy); }
  .field-body textarea { width: 100%; min-height: 280px; font-family: inherit; font-size: 13px; line-height: 1.5; padding: 10px 12px; border: 1px solid var(--navy); border-radius: 6px; resize: vertical; }
  .edit-actions { margin-top: 8px; display: flex; gap: 8px; }
  .na-comment { background: var(--na-bg); border: 1px solid #F0DCB8; border-radius: 6px; padding: 8px 10px; margin-top: 12px; font-size: 12.5px; color: #5C4813; }
  .na-comment .who, .na-comment-readonly .who { font-weight: 600; color: var(--na); display: block; margin-bottom: 4px; }
  .na-comment-readonly { background: var(--na-bg); border: 1px solid #F0DCB8; border-radius: 6px; padding: 8px 10px; margin-top: 8px; font-size: 12.5px; color: #5C4813; }
  .na-actions { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .na-actions-spacer { flex: 1; }
  .btn-copy { background: none; border: none; color: var(--muted); font-size: 11.5px; text-decoration: underline; padding: 4px 2px; }
  .btn-copy:hover { color: var(--text); }
  .na-toggle { background: none; border: none; color: var(--muted); font-size: 12px; padding: 4px 0; margin-top: 10px; display: inline-block; }
  .na-toggle:hover { color: var(--text); }
  .ai-feedback { background: var(--ai-bg); border: 1px solid var(--ai-border); border-radius: 6px; padding: 8px 10px; margin-top: 12px; font-size: 12.5px; color: #1B3A6B; position: relative; }
  .ai-feedback .who { font-weight: 600; margin-right: 4px; }
  .ai-feedback .dismiss { position: absolute; top: 6px; right: 8px; background: none; border: none; color: #1B3A6B; font-size: 13px; opacity: 0.6; }
  .field-footer { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid #EEF0F3; flex-wrap: wrap; }
  .approved-badge { font-size: 11px; font-weight: 600; color: #2F7D4F; background: #E7F6EC; border: 1px solid #BFE6CC; border-radius: 999px; padding: 2px 10px; }
  .approved-label { font-size: 12.5px; font-weight: 600; color: #2F7D4F; }
  .top-approve-bar { margin-bottom: 18px; }
  .top-approve-bar.status-bar {
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    padding: 10px 14px;
  }
  .top-approve-bar.status-bar.approved-status { color: #2F7D4F; background: #E7F6EC; border: 1px solid #BFE6CC; }
  .top-approve-bar.status-bar.reedit-status { color: #1B3A6B; background: #EAF1FB; border: 1px solid #C4D7F0; }
  .top-approve-bar.status-bar .sub { font-weight: 400; font-size: 12px; margin-top: 3px; opacity: 0.9; }
  .chat-panel { position: fixed; top: 0; right: -360px; width: 340px; height: 100%; background: #fff; border-left: 1px solid var(--border); box-shadow: -4px 0 16px rgba(0,0,0,0.08); transition: right 0.25s ease; display: flex; flex-direction: column; z-index: 50; }
  .chat-panel.open { right: 0; }
  .chat-head { background: var(--navy); color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; }
  .chat-head button { background: none; border: none; color: #fff; font-size: 16px; opacity: 0.8; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { font-size: 12.5px; line-height: 1.5; padding: 8px 10px; border-radius: 8px; max-width: 90%; white-space: pre-line; }
  .msg.user { background: var(--navy); color: #fff; align-self: flex-end; }
  .msg.ai { background: #F1F3F6; color: var(--text); align-self: flex-start; }
  .msg.system { background: none; color: var(--muted); font-style: italic; align-self: center; font-size: 11.5px; }
  .proposal { background: var(--ai-bg); border: 1px solid var(--ai-border); border-radius: 8px; padding: 10px; align-self: flex-start; max-width: 92%; font-size: 12.5px; }
  .proposal .ptitle { font-weight: 600; margin-bottom: 6px; color: #1B3A6B; }
  .proposal .ptext { white-space: pre-line; margin-bottom: 8px; }
  .proposal .pactions { display: flex; gap: 8px; }
  .chat-input-row { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
  .chat-input-row input { flex: 1; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 12.5px; font-family: inherit; }
  .overlay { position: fixed; inset: 0; background: rgba(20,25,35,0.45); display: none; align-items: center; justify-content: center; z-index: 100; }
  .overlay.open { display: flex; }
  .modal-box { background: #fff; border-radius: 10px; max-width: 380px; padding: 24px; text-align: center; }
  .modal-box p { font-size: 14px; line-height: 1.6; margin: 0 0 18px; }
  .flash { animation: flashbg 1.4s ease; }
  @keyframes flashbg { 0% { background: #FFF3C4; } 100% { background: transparent; } }
  .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-10px); background: var(--navy); color: #fff; padding: 8px 18px; border-radius: 6px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; z-index: 200; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="prototype-flag" id="protoFlag">Prototype — Chair "My groups" and DNA review, combined. Mock data, scripted AI responses, not connected to a real backend.</div>
<div class="toast" id="toast"></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">Group DNA</div>
  </div>
</header>

<nav class="subnav" id="subnav" style="display:none;">
  <div class="subnav-inner" id="crumb"></div>
</nav>

<div id="app"></div>

<div class="chat-panel" id="chatPanel">
  <div class="chat-head">
    <span>AI assistant</span>
    <button id="chatCloseBtn" aria-label="Close">&times;</button>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input-row">
    <input id="chatInput" type="text" placeholder="Type your reply…">
    <button class="btn btn-small" id="chatSendBtn">Send</button>
  </div>
</div>

<div class="overlay" id="finalApproveOverlay">
  <div class="modal-box">
    <p>All profile fields are approved.</p>
    <button class="btn btn-primary" id="finalApproveBtn">Approve full Group DNA</button>
    <div style="margin-top: 10px;">
      <button class="btn-copy" id="finalApproveDismissBtn">Not now</button>
    </div>
  </div>
</div>

<div class="overlay" id="approveOverlay">
  <div class="modal-box">
    <p>Thank you — the DNA has been updated. It will be updated in Salesforce within five business days.</p>
    <button class="btn btn-primary" id="modalCloseBtn">Close</button>
  </div>
</div>

<script>
/* ============================================================
   Data — 5 groups for Chair "Carsten Wædeled". DNA text for
   Jylland 1 / Sjælland 3 / Vest 12 is adapted from the real
   before/after example documents; Fyn 2 / Øst 5 are shorter
   illustrative fills so the table has enough rows to sort/filter.
   ============================================================ */

function fields(list) {
  return list.map(function (f) {
    return {
      id: f.id, label: f.label, text: f.text,
      naComment: f.naComment || null,
      naResolved: !f.naComment,
      naResolution: null,
      naExpanded: false,
      approved: !!f.approved
    };
  });
}

var GROUPS = [
  {
    id: "jylland1",
    name: "Adm. direktører – Jylland 1",
    country: "Denmark",
    na: "Simon Arun Vrabel",
    status: "chairReview",
    approvedAt: null,
    exportedAt: null,
    lastUpdateText: "Simon Arun Vrabel commented on 2 fields · today, 09:14",
    daysAgo: 0.1,
    dnaFields: fields([
      { id: "group", label: "Group profile",
        text: "**Hvem er gruppen for**\nCEO'er og Group CEOs med fuldt P&L-ansvar i mellemstore og større virksomheder (typisk 150–500+ ansatte) med høj organisatorisk kompleksitet. Typisk omsætningsniveau fra ca. 200 mio. kr. og opefter, afhængigt af struktur og kompleksitet.\nGeografi: Jylland\n\n**Hvad får man**\nFortrolig sparring med ligestillede top-CEO'er med høj kompleksitet og tilsvarende ansvar.\nPerspektiv på strategi, governance, bestyrelsessamspil og transformation.\nCase-baseret sparring på kritiske beslutninger i komplekse organisationer.\nAdgang til et forum hvor topledere arbejder med deres mest strategiske og forretningskritiske dilemmaer.\n\n**Hvad kendetegner gruppen**\n- En af de tungeste CEO-grupper i Jylland\n- Høj organisatorisk og forretningsmæssig kompleksitet\n- Fokus på governance, bestyrelse og transformation frem for drift\n- Sparring udelukkende mellem reelle topledere\n\n**Udviklingsfokus**\n- Fastholde gruppen som en tydelig top-CEO-gruppe\n- Styrke strategisk ledelse og governance-kompetencer\n- Sikre ensartet kompleksitet i medlemsbasen\n- Øge kvaliteten i bestyrelsessamspil og transformationsledelse",
        naComment: "Vi har historisk vægtet ESG kraftigt i denne gruppe — nogle medlemmer er stadig med primært pga. det. Kan vi nævne det kort under \"Hvad kendetegner gruppen\", så det ikke overrasker dem?" },
      { id: "member", label: "Member profile",
        text: "**Titler / erfaring**\nCEO / Group CEO med dokumenteret erfaring på topledelsesniveau.\nAnsvar for virksomhedens samlede performance og strategi.\nErfaring med bestyrelse og governance.\n\n**Ledelsesspænd**\nLeder gennem etableret ledergruppe og flere ledelseslag.\nOrganisation med kompleksitet der kræver strategisk ledelse frem for operativ drift.\n\n**Matcher / matcher ikke**\nMatcher:\n- CEO / Group CEO med fuldt P&L-ansvar\n- Profil med høj organisatorisk kompleksitet\n- Erfaring med bestyrelsessamspil\n\nMatcher ikke:\n- Profiler uden samlet ansvar\n- Virksomheder med for lav kompleksitet\n- Funktionelle ledere uden CEO-mandat",
        naComment: "Vi plejer at gøre en undtagelse for ejerledere, der er majoritetsejere — den er væk nu, under \"Matcher / matcher ikke\". Er det med vilje, eller skal vi have den med igen?" },
      { id: "company", label: "Companies profile",
        text: "**Størrelse / type**\nTypisk 150–500+ ansatte.\nTypisk omsætning fra 200 mio. kr. til flere mia. kr. afhængigt af struktur.\nVirksomheder med kompleks organisation og ledelsesstruktur.\n\n**Branche / marked**\nDiversitet på tværs af brancher.\nFokus på virksomheder med kompleks drift og strategisk tyngde.\nIngen direkte konkurrence mellem medlemmer.\n\n**Matcher / matcher ikke**\nMatcher: virksomheder med kompleks organisation og strategiske udfordringer.\nMatcher ikke: virksomheder uden ledelsesstruktur eller tilstrækkelig kompleksitet.",
        naComment: null }
    ])
  },
  {
    id: "vest12",
    name: "Ledelse & Udvikling – Vest 12",
    country: "Denmark",
    na: "Arthur Alaverdyan",
    status: "waitingNA",
    approvedAt: null,
    exportedAt: null,
    lastUpdateText: "Launched · invitation sent to Arthur Alaverdyan · 3 days ago",
    daysAgo: 3,
    dnaFields: null
  },
  {
    id: "fyn2",
    name: "Adm. direktører – Fyn 2",
    country: "Denmark",
    na: "Signe Bruun",
    status: "approved",
    approvedAt: "2 days ago",
    exportedAt: null,
    lastUpdateText: "Approved by you · 2 days ago",
    daysAgo: 2,
    dnaFields: fields([
      { id: "group", label: "Group profile", approved: true,
        text: "**Hvem er gruppen for**\nAdministrerende direktører med fuldt ledelsesansvar i mellemstore virksomheder (typisk 50–150 ansatte), primært på Fyn.\nTypisk omsætning fra ca. 50–200 mio. kr.\n\n**Hvad får man**\nFortrolig sparring med ligestillede CEO'er i samme kompleksitetsniveau.\nStruktureret erfaringsudveksling på tværs af brancher.\n\n**Hvad kendetegner gruppen**\n- Stærkt sammenhold og høj fremmøde\n- Fokus på drift og vækst frem for transformation\n\n**Udviklingsfokus**\n- Skærpe det kommercielle fokus i sparringen\n- Tiltrække flere profiler fra vækstvirksomheder" },
      { id: "member", label: "Member profile", approved: true,
        text: "**Titler / erfaring**\nAdministrerende direktør med samlet ledelsesansvar.\n\n**Ledelsesspænd**\nLeder gennem et etableret ledelseslag, typisk 20–80 medarbejdere.\n\n**Matcher / matcher ikke**\nMatcher: CEO med fuldt driftsansvar.\nMatcher ikke: funktionsledere uden samlet P&L-ansvar." },
      { id: "company", label: "Companies profile", approved: true,
        text: "**Størrelse / type**\nTypisk 50–150 ansatte, omsætning 50–200 mio. kr.\n\n**Branche / marked**\nBred branchespredning, ingen direkte konkurrenter i gruppen.\n\n**Matcher / matcher ikke**\nMatcher: virksomheder med vækstambitioner.\nMatcher ikke: mikrovirksomheder uden ledelsesstruktur." }
    ])
  },
  {
    id: "sjaelland3",
    name: "Adm. direktører – Sjælland 3",
    country: "Denmark",
    na: "Lars Jensen",
    status: "approved",
    approvedAt: "12 days ago",
    exportedAt: "9 days ago",
    lastUpdateText: "Approved by you · 12 days ago",
    daysAgo: 12,

/* "approved" and "reEdited" are visually identical (both show as "Approved") —
   a re-edit after approval is conveyed by the Last updated timestamp moving
   and the Exported column switching back to Pending, not by a different label. */
var STATUS_META = {
  chairReview: { label: "Needs your review", pillClass: "action", isAction: true },
  waitingNA:   { label: "Waiting on Network Advisor", pillClass: "wait", isAction: false },
  approved:    { label: "Approved", pillClass: "approved", isAction: false },
  reEdited:    { label: "Approved", pillClass: "approved", isAction: false }
};
var STATUS_ORDER = { chairReview: 0, reEdited: 1, approved: 2, waitingNA: 3 };

function formatTimestamp(daysAgo) {
  var ms = Date.now() - (daysAgo * 24 * 60 * 60 * 1000);
  var d = new Date(ms);
  var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var hh = String(d.getHours()).padStart(2, "0");
  var mm = String(d.getMinutes()).padStart(2, "0");
  return d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear() + ", " + hh + ":" + mm;
}

var currentView = "list";       // 'list' | 'waiting' | 'review'
var currentGroupId = null;
var activeFilter = "all";
var searchText = "";
var sortColumn = "priority";    // 'name' | 'na' | 'status' | 'exported' | 'priority'
var sortDir = "asc";

function escapeHtml(s) {

}
function formatFieldText(raw) {

/* ============================================================
   LIST VIEW
   ============================================================ */
function countByStatus(status) {
  return GROUPS.filter(function (g) { return g.status === status; }).length;
}

function exportInfo(g) {
  if (g.status === "chairReview" || g.status === "waitingNA") {
    return { rank: 0, html: '<span class="export-tag na">—</span>' };
  }
  if (g.exportedAt) {
    return { rank: 2, html: '<span class="export-tag exported">✓ Exported</span>' };
  }
  return { rank: 1, html: '<span class="export-tag pending">⏳ Pending</span>' };
}

function matchesSearch(g) {
  if (!searchText) { return true; }
  var q = searchText.toLowerCase();
  return g.name.toLowerCase().indexOf(q) !== -1 || g.na.toLowerCase().indexOf(q) !== -1;
}

/* The "Approved" filter/chip covers both "approved" and "reEdited" groups —
   they render identically (see STATUS_META), so they belong in one bucket. */
function statusMatchesFilter(status, filter) {
  if (filter === "all") { return true; }
  if (filter === "approved") { return status === "approved" || status === "reEdited"; }
  return status === filter;
}

function visibleGroups() {
  var list = GROUPS.filter(function (g) {
    if (!statusMatchesFilter(g.status, activeFilter)) { return false; }
    return matchesSearch(g);
  });

  var col = sortColumn, dir = sortDir === "asc" ? 1 : -1;
  list.sort(function (a, b) {
    var av, bv;
    if (col === "priority") {
      av = STATUS_ORDER[a.status]; bv = STATUS_ORDER[b.status];
    } else if (col === "name") {
      av = a.name.toLowerCase(); bv = b.name.toLowerCase();
    } else if (col === "na") {
      av = a.na.toLowerCase(); bv = b.na.toLowerCase();
    } else if (col === "status") {
      av = STATUS_META[a.status].label.toLowerCase(); bv = STATUS_META[b.status].label.toLowerCase();
    } else if (col === "exported") {
      av = exportInfo(a).rank; bv = exportInfo(b).rank;
    } else if (col === "updated") {
      av = a.daysAgo; bv = b.daysAgo;
    }
    if (av < bv) { return -1 * dir; }
    if (av > bv) { return 1 * dir; }
    return 0;
  });
  return list;
}

var COLUMNS = [
  { key: "name", label: "Group", width: "28%" },
  { key: "na", label: "Network Advisor", width: "15%" },
  { key: "status", label: "Status", width: "16%" },
  { key: "updated", label: "Last updated", width: "20%" },
  { key: "exported", label: "Exported to Salesforce", width: "21%" }
];

function renderListView() {
  var chips = [
    { key: "all", label: "All groups", count: GROUPS.length },
    { key: "chairReview", label: "Needs your review", count: countByStatus("chairReview") },
    { key: "waitingNA", label: "Waiting on Network Advisor", count: countByStatus("waitingNA") },
    { key: "approved", label: "Approved", count: countByStatus("approved") + countByStatus("reEdited") }
  ];
  var chipHtml = chips.map(function (c) {
    var cls = (activeFilter === c.key) ? " active" : "";
    return '<div class="summary-chip' + cls + '" data-filter="' + c.key + '">' + escapeHtml(c.label) + '<span class="count">' + c.count + '</span></div>';
  }).join("");

  var list = visibleGroups();

  var theadHtml = "<tr>" + COLUMNS.map(function (c) {
    var arrow = "";
    if (sortColumn === c.key) { arrow = '<span class="arrow">' + (sortDir === "asc" ? "▲" : "▼") + '</span>'; }
    return '<th data-sort="' + c.key + '">' + escapeHtml(c.label) + arrow + '</th>';
  }).join("") + "</tr>";

  var rowsHtml;
  if (!list.length) {
    rowsHtml = '<tr><td colspan="' + COLUMNS.length + '"><div class="empty-state">No groups match this view.</div></td></tr>';
  } else {
    rowsHtml = list.map(function (g) {
      var meta = STATUS_META[g.status];
      var exp = exportInfo(g);
      var rowCls = meta.isAction ? " is-action" : "";
      return (
        '<tr class="group-row' + rowCls + '" data-id="' + g.id + '">' +
          '<td class="name-cell"><span class="row-action-marker"></span>' + escapeHtml(g.name) + '</td>' +
          '<td>' + escapeHtml(g.na) + '</td>' +
          '<td><span class="pill ' + meta.pillClass + '">' + escapeHtml(meta.label) + '</span></td>' +
          '<td class="muted-cell">' + escapeHtml(formatTimestamp(g.daysAgo)) + '</td>' +
          '<td>' + exp.html + '</td>' +
        '</tr>'
      );
    }).join("");
  }

  var colgroupHtml = "<colgroup>" + COLUMNS.map(function (c) { return '<col style="width:' + c.width + ';">'; }).join("") + "</colgroup>";

  return (
    '<div class="wrap">' +
      '<div class="page-head-row"><div class="page-head"><h1>My groups</h1></div>' + whoPillHtml() + '</div>' +
      '<div class="toolbar">' +
        '<input type="text" class="search-input" id="searchInput" placeholder="Search by group or Network Advisor…" value="' + escapeHtml(searchText) + '">' +
        '<div class="chip-row">' + chipHtml + '</div>' +
      '</div>' +
      '<table class="groups-table">' + colgroupHtml + '<thead>' + theadHtml + '</thead><tbody>' + rowsHtml + '</tbody></table>' +
    '</div>'
  );
}

function allFieldsApproved(g) {
  return g.dnaFields.every(function (f) { return f.approved; });

function renderNaArea(g, f) {
  if (!f.naComment) { return ""; }
  if (!f.naResolved) {
    return (
      '<div class="na-comment">' +
        '<div class="who">Network Advisor:</div>' +
        '<div>' + escapeHtml(f.naComment) + '</div>' +
        '<div class="na-actions">' +
          '<button class="btn btn-small" data-na-include="' + f.id + '">Include</button>' +
          '<button class="btn btn-small" data-na-disregard="' + f.id + '">Disregard</button>' +

          '<button class="btn-copy" data-na-copy="' + f.id + '" aria-label="Copy comment">Copy</button>' +
        '</div>' +
      '</div>'
    );
  }
  var arrow = f.naExpanded ? "▾" : "▸";
  var expandedBlock = f.naExpanded

  return '<button class="na-toggle" data-na-toggle="' + f.id + '">' + arrow + ' See network advisor comments</button>' + expandedBlock;

function renderFooter(g, f) {

        '<div class="na-actions-spacer"></div>' +
        '<button class="btn btn-small" data-edit="' + f.id + '">Edit</button>' +
        '<button class="btn btn-small" data-field-ai="' + f.id + '">Edit with AI</button>' +
      '</div>'
    );
  }
  return (
    '<div class="field-footer">' +
      '<button class="btn btn-small" data-edit="' + f.id + '">Edit</button>' +
      '<button class="btn btn-small" data-field-ai="' + f.id + '">Edit with AI</button>' +
      '<button class="btn btn-small btn-primary" data-field-approve="' + f.id + '">Approve text</button>' +
    '</div>'

}

function renderCard(g, f) {
  return (
    '<div class="section-card" id="wrap-' + f.id + '">' +
      '<div class="card-head">' +
        '<h2>' + escapeHtml(f.label) + '</h2>' +

/* Same "Approved" banner whether or not the Chair has re-edited since —
   the Last updated timestamp and the export line below are what change. */
function statusBarHtml(g) {
  if (g.status !== "approved" && g.status !== "reEdited") { return ""; }
  var exportSub = g.exportedAt
    ? "Exported to Salesforce on " + escapeHtml(g.exportedAt) + "."
    : "Pending export to Salesforce (usually within five business days).";
  return '<div class="top-approve-bar status-bar approved-status">Approved by ' + escapeHtml(CHAIR_NAME) +
    '<div class="sub">Last updated ' + escapeHtml(formatTimestamp(g.daysAgo)) + ' · ' + exportSub + '</div></div>';
}

function renderReviewView(g) {
  var topArea = (g.status === "approved" || g.status === "reEdited") ? statusBarHtml(g) : (fullyApprovedJustNow ? statusBarHtml(groupById[g.id]) : "");
  return (
    '<div class="wrap">' +
      '<div id="topApproveArea">' + topArea + '</div>' +

/* ============================================================

  var g = groupById[id];

/* ---------- NA comment handling ---------- */
function legacyCopy(text) {
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
}
function naCopy(f) {
  var text = f.naComment;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { showToast("Comment copied"); })
      .catch(function () { legacyCopy(text); showToast("Comment copied"); });
  } else { legacyCopy(text); showToast("Comment copied"); }
}

function incorporationFor(g, fieldId) {
  if (g.id === "jylland1" && fieldId === "group") {
    var f = g.dnaFields.find(function (x) { return x.id === "group"; });
    var newText = f.text.replace(
      "- Sparring udelukkende mellem reelle topledere\n\n**Udviklingsfokus**",
      "- Sparring udelukkende mellem reelle topledere\n- Historisk forankret i ESG, men i dag vurderet primært efter kompleksitet og ledelsesansvar\n\n**Udviklingsfokus**"
    );
    return { text: newText, note: "Based on the NA's comment — added under \"Hvad kendetegner gruppen\"." };
  }
  if (g.id === "jylland1" && fieldId === "member") {
    var f2 = g.dnaFields.find(function (x) { return x.id === "member"; });
    var newText2 = f2.text.replace(
      "- Erfaring med bestyrelsessamspil\n\nMatcher ikke:",
      "- Erfaring med bestyrelsessamspil\n- Ejerledere med majoritetsejerskab (>50%) kan optages\n\nMatcher ikke:"
    );
    return { text: newText2, note: "Based on the NA's comment — added under \"Matcher / matcher ikke\"." };
  }
  return null;
}

function naInclude(g, id) {
  var f = g.dnaFields.find(function (x) { return x.id === id; });
  var inc = incorporationFor(g, id);
  if (inc) {
    f.text = inc.text;
    var textEl = document.getElementById("text-" + id);
    textEl.outerHTML = '<div class="field-text flash" id="text-' + id + '">' + formatFieldText(f.text) + '</div>';
  }
  f.naResolved = true; f.naResolution = "included"; f.naExpanded = false;
  rerenderNa(g, id); rerenderFooter(g, id);
  showToast("Comments included");
}
function naDisregard(g, id) {
  var f = g.dnaFields.find(function (x) { return x.id === id; });
  f.naResolved = true; f.naResolution = "disregarded"; f.naExpanded = false;
  rerenderNa(g, id); rerenderFooter(g, id);
}
function naToggle(g, id) {
  var f = g.dnaFields.find(function (x) { return x.id === id; });
  f.naExpanded = !f.naExpanded;
  rerenderNa(g, id);
}
function naEditWithAI(g, id) {
  chatPanel.classList.add("open");
  var f = g.dnaFields.find(function (x) { return x.id === id; });
  pendingField = id; pendingFieldMode = "na";
  addMsg("Network Advisor comment:\n\n\"" + f.naComment + "\"", "ai");
  addMsg("What should we include?", "ai");
}
function footerEditWithAI(g, id) {
  chatPanel.classList.add("open");
  var f = g.dnaFields.find(function (x) { return x.id === id; });
  pendingField = id; pendingFieldMode = "generic";
  addMsg("Let me know what you would like to change in the " + f.label + ".", "ai");
}

/* ---------- approve / re-edit transitions ---------- */
function markGroupReEdited(g) {
  if (g.status === "approved" || g.status === "reEdited") {
    g.status = "reEdited";
    g.exportedAt = null;
    g.lastUpdateText = "You edited the DNA after approval · just now";
    g.daysAgo = 0;
    if (currentView === "review") { rerenderTopArea(g); rerenderStatusPill(g); renderHeader(); }
  }
}

function approveField(g, id) {
  var f = g.dnaFields.find(function (x) { return x.id === id; });
  f.approved = true;
  var badge = document.getElementById("approved-" + id);
  if (badge) { badge.style.display = "inline"; }
  rerenderFooter(g, id);
  showToast("Field approved");
  if (allFieldsApproved(g)) { finalApproveOverlay.classList.add("open"); }
}

function formatNow() {
  return "today";
}

/* ---------- clicks ---------- */
document.addEventListener("click", function (e) {
  var t = e.target;

  // header / crumb
  if (t.id === "crumbHome") { goToList(); return; }

  // list view
  var filterEl = t.closest && t.closest("[data-filter]");
  if (filterEl) { activeFilter = filterEl.getAttribute("data-filter"); render(); return; }

  var sortTh = t.closest && t.closest("th[data-sort]");
  if (sortTh) {
    var col = sortTh.getAttribute("data-sort");
    if (sortColumn === col) { sortDir = (sortDir === "asc") ? "desc" : "asc"; }
    else { sortColumn = col; sortDir = "asc"; }
    render();
    return;
  }

  var rowEl = t.closest && t.closest("tr.group-row");
  if (rowEl) { openGroup(rowEl.getAttribute("data-id")); return; }

  // waiting view
  if (t.id === "backToListBtn") { goToList(); return; }

  // review view — needs an active group
  var g = currentGroupId ? groupById[currentGroupId] : null;
  if (!g) { return; }

  var editId = t.getAttribute && t.getAttribute("data-edit");
  if (editId) { startEdit(g, editId); return; }
  var saveId = t.getAttribute && t.getAttribute("data-save");
  if (saveId) { saveEdit(g, saveId); return; }
  var cancelId = t.getAttribute && t.getAttribute("data-cancel");
  if (cancelId) { cancelEdit(g, cancelId); return; }
  var dismissId = t.getAttribute && t.getAttribute("data-dismiss-ai");
  if (dismissId) { document.getElementById("aifeedback-" + dismissId).innerHTML = ""; return; }
  var naIncludeId = t.getAttribute && t.getAttribute("data-na-include");
  if (naIncludeId) { naInclude(g, naIncludeId); return; }
  var naDisregardId = t.getAttribute && t.getAttribute("data-na-disregard");
  if (naDisregardId) { naDisregard(g, naDisregardId); return; }
  var naAiId = t.getAttribute && t.getAttribute("data-na-ai");
  if (naAiId) { naEditWithAI(g, naAiId); return; }
  var naCopyId = t.getAttribute && t.getAttribute("data-na-copy");
  if (naCopyId) { naCopy(g.dnaFields.find(function (x) { return x.id === naCopyId; })); return; }
  var naToggleId = t.getAttribute && t.getAttribute("data-na-toggle");
  if (naToggleId) { naToggle(g, naToggleId); return; }
  var fieldAiId = t.getAttribute && t.getAttribute("data-field-ai");
  if (fieldAiId) { footerEditWithAI(g, fieldAiId); return; }
  var fieldApproveId = t.getAttribute && t.getAttribute("data-field-approve");
  if (fieldApproveId) { approveField(g, fieldApproveId); return; }
  var topApproveClick = t.getAttribute && t.getAttribute("data-top-approve");
  if (topApproveClick) { approveOverlay.classList.add("open"); return; }
});

document.addEventListener("input", function (e) {
  if (e.target && e.target.id === "searchInput") {
    searchText = e.target.value;
    render();
    // keep focus + caret in the search box across re-render
    var input = document.getElementById("searchInput");
    if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  }
});

function startEdit(g, id) {
  var f = g.dnaFields.find(function (x) { return x.id === id; });
  var box = document.getElementById("text-" + id);
  box.outerHTML =
    '<div id="text-' + id + '">' +
      '<textarea id="edit-' + id + '">' + escapeHtml(f.text) + '</textarea>' +
      '<div class="edit-actions">' +
        '<button class="btn btn-small btn-primary" data-save="' + id + '">Save</button>' +
        '<button class="btn btn-small" data-cancel="' + id + '">Cancel</button>' +
      '</div>' +
    '</div>';
}
function cancelEdit(g, id) {
  var f = g.dnaFields.find(function (x) { return x.id === id; });
  var box = document.getElementById("text-" + id);
  box.outerHTML = '<div class="field-text" id="text-' + id + '">' + formatFieldText(f.text) + '</div>';
}
function feedbackFor(oldText, newText) {
  if (newText.length > oldText.length + 15) {
    return "Tilføjelsen er relevant. Tjek at den ikke gør kriteriet blødere — tilføjelser trækker let i den retning.";
  }
  if (newText.length < oldText.length - 15) {
    return "Kortere version. Det holder teksten skarp, så længe det centrale matchkriterium stadig fremgår tydeligt.";
  }
  var pool = [
    "Formuleringen er stadig operationel og skarp. Ingen bemærkninger.",
    "Ser fint ud. Et forslag: undgå bløde ord som \"typisk\" hvis kriteriet skal kunne bruges til at sige klart nej.",
    "Ændringen bevarer retningen fra den AI-genererede version."
  ];
  return pool[Math.floor(Math.random() * pool.length)];
}
function saveEdit(g, id) {
  var f = g.dnaFields.find(function (x) { return x.id === id; });
  var textarea = document.getElementById("edit-" + id);
  var newText = textarea.value;
  var oldText = f.text;
  f.text = newText;
  var box = document.getElementById("text-" + id);
  box.outerHTML = '<div class="field-text flash" id="text-' + id + '">' + formatFieldText(f.text) + '</div>';

  var msg = feedbackFor(oldText, newText);
  document.getElementById("aifeedback-" + id).innerHTML =
    '<div class="ai-feedback"><span class="who">AI feedback:</span>' + escapeHtml(msg) +
    '<button class="dismiss" data-dismiss-ai="' + id + '" aria-label="Dismiss">&times;</button></div>';

  // Editing an already-approved field after the group was approved = a re-edit.
  if (f.approved && (g.status === "approved" || g.status === "reEdited")) {
    markGroupReEdited(g);
  }
}

var chatPanel = document.getElementById("chatPanel");
document.getElementById("chatCloseBtn").addEventListener("click", function () { chatPanel.classList.remove("open"); });
var chatMessages = document.getElementById("chatMessages");
function addMsg(text, cls) {
  var div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}
function addProposal(fieldId, newText, note, naFieldId) {
  var g = groupById[currentGroupId];
  var f = g.dnaFields.find(function (x) { return x.id === fieldId; });
  var div = document.createElement("div");
  div.className = "proposal";
  div.innerHTML =
    '<div class="ptitle">Proposed update — ' + escapeHtml(f.label) + '</div>' +
    '<div class="ptext">' + formatFieldText(newText) + '</div>' +
    (note ? '<div class="ptext" style="color:#1B3A6B;font-style:italic;">' + escapeHtml(note) + '</div>' : '') +
    '<div class="pactions">' +
      '<button class="btn btn-small btn-primary" data-accept-field="' + fieldId + '">Accept</button>' +
      '<button class="btn btn-small" data-reject="1">Reject</button>' +
    '</div>';
  div.dataset.newText = newText;
  div.dataset.naFieldId = naFieldId || "";
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}
chatMessages.addEventListener("click", function (e) {
  var g = groupById[currentGroupId];
  if (!g) { return; }
  var acceptId = e.target.getAttribute && e.target.getAttribute("data-accept-field");
  if (acceptId) {
    var proposalDiv = e.target.closest(".proposal");
    var newText = proposalDiv.dataset.newText;
    var f = g.dnaFields.find(function (x) { return x.id === acceptId; });
    var wasApproved = f.approved;
    f.text = newText;
    var textEl = document.getElementById("text-" + acceptId);
    if (textEl) { textEl.outerHTML = '<div class="field-text flash" id="text-' + acceptId + '">' + formatFieldText(f.text) + '</div>'; }
    proposalDiv.style.opacity = "0.5";
    proposalDiv.querySelectorAll("button").forEach(function (b) { b.disabled = true; });
    addMsg("Applied to \"" + f.label + "\".", "system");
    if (proposalDiv.dataset.naFieldId) {
      var naF = g.dnaFields.find(function (x) { return x.id === proposalDiv.dataset.naFieldId; });
      naF.naResolved = true; naF.naResolution = "ai-edited"; naF.naExpanded = false;
      rerenderNa(g, proposalDiv.dataset.naFieldId);
      rerenderFooter(g, proposalDiv.dataset.naFieldId);
    }
    if (wasApproved && (g.status === "approved" || g.status === "reEdited")) { markGroupReEdited(g); }
  }
  if (e.target.getAttribute && e.target.getAttribute("data-reject")) {
    var pd = e.target.closest(".proposal");
    pd.style.opacity = "0.5";
    pd.querySelectorAll("button").forEach(function (b) { b.disabled = true; });
    addMsg("Proposal discarded.", "system");
  }
});
function genericProposalFor(g, fieldId, userText) {
  var f = g.dnaFields.find(function (x) { return x.id === fieldId; });
  var lower = userText.toLowerCase();
  if (g.id === "jylland1" && fieldId === "group" && (lower.indexOf("udvikl") !== -1 || lower.indexOf("skarp") !== -1 || lower.indexOf("sharp") !== -1)) {
    var newText = f.text.replace(
      "**Udviklingsfokus**\n- Fastholde gruppen som en tydelig top-CEO-gruppe\n- Styrke strategisk ledelse og governance-kompetencer\n- Sikre ensartet kompleksitet i medlemsbasen\n- Øge kvaliteten i bestyrelsessamspil og transformationsledelse",
      "**Udviklingsfokus**\n- Fastholde gruppen som top-CEO-gruppe\n- Styrke governance-kompetencer\n- Ensartet kompleksitet i medlemsbasen\n- Højere kvalitet i bestyrelsessamspil"
    );
    if (newText !== f.text) { return { text: newText, note: "Shortened \"Udviklingsfokus\" for a sharper, more operational read." }; }
  }
  var stripped = f.text.replace(/Typisk /g, "").replace(/typisk /g, "");
  if (stripped !== f.text) { return { text: stripped, note: "Removed \"typisk\" — a soft qualifier that makes the criterion harder to apply as a clear yes/no test." }; }
  return null;
}
function handleUserMessage(text) {
  addMsg(text, "user");
  var g = groupById[currentGroupId];
  var fid = pendingField, mode = pendingFieldMode;
  pendingField = null; pendingFieldMode = null;
  var result = null;
  if (g && fid && mode === "na") { result = incorporationFor(g, fid); }
  else if (g && fid && mode === "generic") { result = genericProposalFor(g, fid, text); }
  setTimeout(function () {
    if (result) { addMsg("Here's a proposal:", "ai"); addProposal(fid, result.text, result.note, mode === "na" ? fid : null); }
    else { addMsg("I don't have a scripted suggestion for that in this prototype.", "ai"); }
  }, 350);
}
document.getElementById("chatSendBtn").addEventListener("click", function () {
  var input = document.getElementById("chatInput");
  var val = input.value.trim();
  if (!val) { return; }
  input.value = "";
  handleUserMessage(val);
});
document.getElementById("chatInput").addEventListener("keydown", function (e) {
  if (e.key === "Enter") { document.getElementById("chatSendBtn").click(); }
});

var finalApproveOverlay = document.getElementById("finalApproveOverlay");
document.getElementById("finalApproveBtn").addEventListener("click", function () {
  finalApproveOverlay.classList.remove("open");
  approveOverlay.classList.add("open");
});
document.getElementById("finalApproveDismissBtn").addEventListener("click", function () {
  finalApproveOverlay.classList.remove("open");
});

var approveOverlay = document.getElementById("approveOverlay");
document.getElementById("modalCloseBtn").addEventListener("click", function () {
  approveOverlay.classList.remove("open");
  var g = groupById[currentGroupId];
  if (g) {
    g.status = "approved";
    g.approvedAt = "today";
    g.exportedAt = null;
    g.lastUpdateText = "Approved by you · just now";
    g.daysAgo = 0;
    fullyApprovedJustNow = true;
    render();
  }
});

render();
</script>
